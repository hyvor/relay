name: Sync docs to marketing

# Tells hyvor/marketing to sync docs/ when it changes on main.
# See README.md ("Product docs") in hyvor/marketing.

on:
    push:
        branches: [main]
        paths: [docs/**]
    workflow_dispatch:

jobs:
    dispatch:
        runs-on: ubuntu-latest
        steps:
            -   run: |
                    curl -fsS -X POST \
                      -H "Authorization: Bearer ${{ secrets.HYVOR_ORG_CORE_DISPATCH_TOKEN }}" \
                      -H "Accept: application/vnd.github+json" \
                      https://api.github.com/repos/hyvor/marketing/dispatches \
                      -d '{"event_type":"docs-updated","client_payload":{"product":"relay"}}'
